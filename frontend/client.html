<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>SafeChat Demo</title>
</head>
<body>
  <h2>SafeChat Demo</h2>

  <label>JWT Token :</label>
  <input id="jwtToken" placeholder="Paste JWT token here" style="width:400px" />
  <br><br>

  <label>Conversation ID :</label>
  <input id="conversationId" placeholder="Paste conversation ObjectId here" />
  <button id="connectBtn">Connect + Join</button>

  <br><br>

  <input id="message" placeholder="Type a message..." />
  <button id="sendBtn">Send</button>

  <ul id="messages"></ul>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    let socket = null;

    const jwtTokenInput = document.getElementById("jwtToken");
    const conversationIdInput = document.getElementById("conversationId");
    const messageInput = document.getElementById("message");
    const messagesList = document.getElementById("messages");
    const connectBtn = document.getElementById("connectBtn");

    function addMessage(text) {
      const li = document.createElement("li");
      li.textContent = text;
      messagesList.appendChild(li);
    }

    connectBtn.onclick = () => {
      const token = jwtTokenInput.value.trim();
      const conversationId = conversationIdInput.value.trim();

      if (!token || !conversationId) {
        alert("Please enter JWT token and conversationId");
        return;
      }

      if (socket) {
        socket.disconnect();
      }

      socket = io("http://localhost:3001", {
        auth: { token }
      });

      socket.on("connect", () => {
        console.log("Connected:", socket.id);
        socket.emit("conversation:join", { conversationId });
      });

      socket.on("connect_error", (err) => {
        console.error("Connection error:", err.message);
        alert("Connection error: " + err.message);
        connectBtn.disabled = false;
        connectBtn.textContent = "Connect + Join";
      });

      socket.on("conversation:joined", (data) => {
        console.log("Joined conversation:", data.conversationId);
        addMessage(`✅ Joined conversation ${data.conversationId}`);
      });

      socket.on("conversation:error", (err) => {
        console.error("Join error:", err);
        alert("Join error: " + JSON.stringify(err));
      });

      socket.on("message:new", (msg) => {
        const sender =
          msg.sender?.username ||
          msg.sender?.phone ||
          msg.senderId ||
          msg.sender ||
          "unknown";

        addMessage(`${sender}: ${msg.content}`);
      });

      socket.on("message:ack", (ack) => {
        console.log("Message ACK:", ack);
      });

      socket.on("message:error", (err) => {
        console.error("Message error:", err);
        alert("Message error: " + JSON.stringify(err));
      });

      connectBtn.disabled = true;
      connectBtn.textContent = "Connected";
    };

    document.getElementById("sendBtn").onclick = () => {
      if (!socket) {
        alert("Please connect first");
        return;
      }

      const conversationId = conversationIdInput.value.trim();
      const content = messageInput.value.trim();

      if (!content) return;

      socket.emit("message:send", {
        conversationId,
        content,
        clientMessageId: Date.now().toString()
      });

      messageInput.value = "";
    };
  </script>
</body>
</html>
